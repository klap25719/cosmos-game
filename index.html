<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmos Sport - Αξιολόγηση Πολιτισμικής Εφαρμογής | Culture Fit Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" 
integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #D0021B;
    --black: #111111;
    --white: #ffffff;
    --bg: #F7F6F2;
    --surface: #EFEFEB;
    --border: rgba(0,0,0,0.12);
    --text: #111111;
    --muted: #666666;
    --radius: 8px;
    --radius-lg: 12px;
    --font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --font-heading: 'Inter', 'DM Sans', system-ui, sans-serif;
  }

  body {
    font-family: var(--font-family);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 32px 16px 48px;
    color: var(--text);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.5;
  }

  .game-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: 0 2px 24px rgba(0,0,0,0.10);
    width: 100%;
    max-width: 720px;
    overflow: hidden;
  }

  .header {
    background: var(--black);
    padding: 18px 28px 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 3px solid var(--red);
  }

  .logo-wrapper {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .logo-img {
    height: 50px;
    width: auto;
    object-fit: contain;
  }

  .header-right { margin-left: auto; text-align: right; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .lang-toggle { display: flex; gap: 6px; background: #2a2a2a; padding: 4px 8px; border-radius: 40px; }
  .lang-btn { background: transparent; border: none; color: #aaa; font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 12px; border-radius: 30px; transition: all 0.2s; font-family: var(--font-family); }
  .lang-btn.active { background: var(--red); color: white; }
  .header-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }
  .header-title { font-size: 13px; color: #fff; font-weight: 500; margin-top: 3px; font-family: var(--font-family); }

  .progress-outer { height: 4px; background: #2a2a2a; }
  .progress-inner { height: 4px; background: var(--red); transition: width 0.5s ease; width: 0%; }

  .screen { display: none; padding: 36px 32px; animation: fadeIn 0.28s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .intro-badge { display: inline-block; background: var(--red); color: #fff; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; font-family: var(--font-family); }
  .intro-heading {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 38px;
    line-height: 1.05;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .intro-sub { font-size: 15px; color: var(--muted); line-height: 1.7; max-width: 500px; margin-bottom: 28px; font-weight: 400; }

  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 32px; }
  .pillar { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 10px; text-align: center; transition: transform 0.1s; }
  .pillar-icon { font-size: 24px; margin-bottom: 7px; }
  .pillar-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-family: var(--font-family); }

  .btn-primary { background: var(--red); color: #fff; border: none; font-family: var(--font-heading); font-weight: 700; font-size: 18px; letter-spacing: 1.5px; padding: 14px 42px; cursor: pointer; border-radius: 2px; transition: background 0.15s, transform 0.1s; }
  .btn-primary:hover { background: #b50018; }
  .btn-dark { background: var(--black); color: #fff; border: none; font-family: var(--font-heading); font-weight: 700; font-size: 16px; letter-spacing: 1.5px; padding: 12px 32px; cursor: pointer; border-radius: 2px; display: none; margin-top: 18px; width: 100%; justify-content: center; }
  .btn-dark:hover { background: #333; }
  .btn-dark.show { display: inline-block; }

  /* Name input field styles */
  .name-input-area {
    margin: 20px 0 24px;
    padding: 20px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .name-input-area label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .name-input-field {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    font-family: var(--font-family);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--white);
    transition: all 0.2s;
  }
  .name-input-field:focus {
    outline: none;
    border-color: var(--red);
    box-shadow: 0 0 0 2px rgba(208,2,27,0.2);
  }
  .candidate-name-display {
    margin-top: 20px;
    padding: 12px 16px;
    background: var(--white);
    border-radius: var(--radius);
    border-left: 3px solid var(--red);
    font-weight: 500;
  }

  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .q-category { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--red); font-family: var(--font-family); }
  .q-counter { font-size: 13px; color: var(--muted); font-weight: 500; }
  .q-text { font-family: var(--font-heading); font-weight: 800; font-size: 28px; line-height: 1.25; letter-spacing: -0.01em; margin-bottom: 12px; }
  .q-context { font-size: 14px; color: var(--muted); background: var(--surface); border-left: 3px solid var(--red); border-radius: 0 var(--radius) var(--radius) 0; padding: 12px 14px; margin-bottom: 24px; display: none; font-weight: 450; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: var(--white); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; text-align: left; cursor: pointer; font-size: 14px; color: var(--text); line-height: 1.55; display: flex; align-items: flex-start; gap: 12px; transition: all 0.1s; width: 100%; font-family: var(--font-family); font-weight: 450; }
  .option-btn:hover:not(:disabled) { border-color: var(--red); background: var(--surface); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { border-color: #2d9e2d; background: #eaf3ea; color: #1a6e1a; }
  .option-btn.wrong { border-color: #c0392b; background: #faeaea; color: #8e1c1c; }
  .option-btn.reveal { border-color: #2d9e2d; background: #eaf3ea; color: #1a6e1a; opacity: 0.72; }
  .opt-letter { width: 22px; min-width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

  .feedback-box { margin-top: 18px; padding: 14px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.65; display: none; font-weight: 500; font-family: var(--font-family); }
  .feedback-box.show { display: block; }
  .feedback-box.good { background: #eaf3ea; border: 0.5px solid #2d9e2d; color: #1a6e1a; }
  .feedback-box.bad { background: #faeaea; border: 0.5px solid #c0392b; color: #8e1c1c; }

  .score-header { background: var(--black); margin: -36px -32px 28px; padding: 32px 32px 28px; border-bottom: 3px solid var(--red); color: #fff; }
  .score-label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #aaa; margin-bottom: 8px; font-weight: 500; }
  .score-big { font-family: var(--font-heading); font-weight: 800; font-size: 76px; line-height: 1; color: #fff; letter-spacing: -0.02em; }
  .score-big span { color: var(--red); }
  .verdict-badge { display: inline-block; padding: 6px 16px; border-radius: 2px; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-top: 14px; font-family: var(--font-family); }
  .verdict-badge.great { background: var(--red); color: #fff; }
  .verdict-badge.good-fit { background: #2d9e2d; color: #fff; }
  .verdict-badge.partial { background: #d4830a; color: #fff; }
  .verdict-badge.low { background: #888; color: #fff; }
  .result-text { font-size: 15px; color: var(--muted); line-height: 1.75; margin-bottom: 24px; max-width: 540px; font-weight: 450; }
  .dimension-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .dimension-card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; }
  .dim-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; font-family: var(--font-family); }
  .dim-bar-outer { height: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; margin-bottom: 7px; }
  .dim-bar-inner { height: 6px; background: var(--red); border-radius: 3px; width: 0%; transition: width 0.8s ease; }
  .dim-score { font-size: 12px; color: var(--muted); font-weight: 500; }
  .action-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-outline { background: transparent; color: var(--text); border: 0.5px solid var(--border); font-family: var(--font-heading); font-weight: 700; font-size: 16px; letter-spacing: 1.5px; padding: 12px 28px; cursor: pointer; border-radius: 2px; transition: background 0.15s; }
  .btn-outline:hover { background: var(--surface); }
  
  /* PDF export specific styles */
  @media print {
  /* Κρύβουμε τα interactive στοιχεία */
  .btn-primary, .btn-outline, .lang-toggle, .btn-dark, 
  .name-input-area, #next-btn, .option-btn, .feedback-box,
  .action-row button {
    display: none !important;
  }
  
  /* Εξασφαλίζουμε τα ΑΚΡΙΒΗ χρώματα */
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
  
  /* Το μαύρο background να μείνει μαύρο */
  .score-header, .header {
    background: #111111 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  /* Το κόκκινο να μείνει κόκκινο */
  .verdict-badge.great, .btn-primary, .progress-inner,
  .dim-bar-inner, .intro-badge {
    background: #D0021B !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  /* Λευκό κείμενο σε σκούρο φόντο */
  .score-header, .header, .verdict-badge {
    color: white !important;
  }
  
  /* Βεβαιωνόμαστε ότι το φόντο της κάρτας είναι λευκό */
  .game-card, .screen, body {
    background: white !important;
  }
  
  /* Αποφυγή break μέσα σε κάρτες */
  .dimension-card, .score-header, .result-text {
    break-inside: avoid;
    page-break-inside: avoid;
  }
}

  @media (max-width: 520px) {
    body { padding: 16px 8px 40px; }
    .screen { padding: 24px 20px; }
    .score-header { margin: -24px -20px 24px; padding: 24px 20px 20px; }
    .intro-heading { font-size: 34px; }
    .pillars { grid-template-columns: repeat(2, 1fr); }
    .dimension-grid { grid-template-columns: 1fr; }
    .score-big { font-size: 52px; }
    .header-right { flex-direction: column; align-items: flex-end; gap: 5px; }
    .q-text { font-size: 24px; }
    .logo-img { height: 40px; }
  }
</style>
</head>
<body>

<div class="game-card">
  <div class="header">
    <div class="logo-wrapper">
      <img class="logo-img" src="logo.png" alt="Cosmos Sport Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
      <div style="display:none; color:white; font-weight:800; font-size:20px;">COSMOS SPORT</div>
    </div>
    <div class="header-right">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="el">GR</button>
      </div>
      <div>
        <div class="header-label" id="headerLabel">Culture Fit Assessment</div>
        <div class="header-title" id="header-title">Candidate Evaluation</div>
      </div>
    </div>
  </div>
  <div class="progress-outer"><div class="progress-inner" id="progress-bar"></div></div>

  <!-- Intro Screen -->
  <div class="screen active" id="screen-intro">
    <span class="intro-badge" id="introBadge">Interview Game</span>
    <div class="intro-heading" id="introHeading">Are You a<br>Cosmos Sport<br>Fit?</div>
    <p class="intro-sub" id="introSub">10 situational challenges that reveal how you think, act, and move in a fast-paced sports retail environment.</p>
    
    <!-- Name input field -->
    <div class="name-input-area">
      <label for="candidateName" id="nameLabel">👤 YOUR NAME / ΟΝΟΜΑΤΕΠΩΝΥΜΟ</label>
      <input type="text" id="candidateName" class="name-input-field" placeholder="e.g., Maria Papadopoulou / Μαρία Παπαδοπούλου" autocomplete="off">
      <div class="candidate-name-display" id="nameDisplay" style="display: none;">
        ⭐ <span id="nameDisplayText"></span>
      </div>
    </div>
    
    <div class="pillars" id="pillarsContainer">
      <div class="pillar"><div class="pillar-icon">🏃</div><div class="pillar-name" data-key="perf">Performance</div></div>
      <div class="pillar"><div class="pillar-icon">🤝</div><div class="pillar-name" data-key="team">Teamwork</div></div>
      <div class="pillar"><div class="pillar-icon">🔥</div><div class="pillar-name" data-key="pass">Passion</div></div>
      <div class="pillar"><div class="pillar-icon">🎯</div><div class="pillar-name" data-key="cust">Customer</div></div>
    </div>
    <button class="btn-primary" id="startBtn">START THE CHALLENGE</button>
  </div>

  <!-- Question Screen -->
  <div class="screen" id="screen-question">
    <div class="q-meta"><div class="q-category" id="q-category"></div><div class="q-counter" id="q-counter"></div></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-context" id="q-context"></div>
    <div class="options" id="options"></div>
    <div class="feedback-box" id="feedback-box"></div>
    <button class="btn-dark" id="next-btn">NEXT CHALLENGE →</button>
  </div>

  <!-- Results Screen -->
  <div class="screen" id="screen-result">
    <div class="score-header">
      <div class="score-label" id="scoreLabel">Your culture fit score</div>
      <div class="score-big" id="score-display"></div>
      <div id="verdict-badge-wrap"></div>
      <div id="resultNameDisplay" style="margin-top: 15px; font-size: 14px; color: #aaa;"></div>
    </div>
    <p class="result-text" id="result-text"></p>
    <div class="dimension-grid" id="dimension-grid"></div>
    <div class="action-row">
      <button class="btn-primary" id="restartBtn">PLAY AGAIN</button>
      <button class="btn-outline" id="printBtn">📄 EXPORT PDF</button>
    </div>
  </div>
</div>

<script>
// ---------- MULTILINGUAL CONTENT (EN + EL) ----------
const strings = {
  en: {
    headerLabel: "Culture Fit Assessment", headerTitleDefault: "Candidate Evaluation",
    introBadge: "Interview Game", introHeading: "Are You a<br>Cosmos Sport<br>Fit?",
    introSub: "10 situational challenges that reveal how you think, act, and move in a fast-paced sports retail environment.",
    nameLabel: "👤 YOUR FULL NAME",
    namePlaceholder: "e.g., Maria Papadopoulou",
    pillars: { perf: "Performance", team: "Teamwork", pass: "Passion", cust: "Customer Focus" },
    startBtn: "START THE CHALLENGE", nextBtn: "NEXT CHALLENGE →", resultsBtn: "SEE RESULTS →",
    scoreLabel: "Your culture fit score", restart: "PLAY AGAIN", print: "EXPORT PDF",
    verdicts: { great: "COSMOS MATERIAL", good: "STRONG FIT", partial: "DEVELOPING FIT", low: "NEEDS ALIGNMENT" },
    resultTexts: {
      great: "Outstanding cultural alignment. You embody the Cosmos Sport values: passion, performance, teamwork, and customer obsession. You'd thrive in this environment from day one.",
      good: "You show solid alignment with the Cosmos Sport culture. Your instincts are right in most situations. With some coaching and time in the environment, you'd be a real asset to the team.",
      partial: "You have some of the right instincts but there are areas to strengthen. Reflect on the scenarios where you hesitated, those are growth opportunities in a sports retail culture.",
      low: "This candidate may require a mindset shift. Cosmos Sport's culture is deeply rooted in sport, teamwork, and customer-first thinking. Consider how aligned you are with those values."
    },
    dimLabels: { customer: "Customer Focus", team: "Teamwork", performance: "Performance", passion: "Brand Passion" },
    candidatePrefix: "Candidate: "
  },
  el: {
    headerLabel: "Αξιολόγηση Κουλτούρας",
    headerTitleDefault: "Αξιολόγηση Υποψηφίου",
    introBadge: "Παιχνίδι Συνέντευξης",
    introHeading: "Ταιριάζεις με την Cosmos Sport;",
    introSub: "10 σενάρια που αποκαλύπτουν πώς σκέφτεσαι σε ένα γρήγορο περιβάλλον αθλητικού retail. Δεν υπάρχουν σωστές ή λάθος απαντήσεις - μόνο αυθεντικές.",
    nameLabel: "👤 ΟΝΟΜΑΤΕΠΩΝΥΜΟ",
    namePlaceholder: "π.χ. Μαρία Παπαδοπούλου",
    pillars: { perf: "Απόδοση", team: "Ομαδικότητα", pass: "Πάθος", cust: "Πελατοκεντρισμός" },
    startBtn: "ΞΕΚΙΝΑ ΕΔΩ",
    nextBtn: "ΕΠΟΜΕΝΟ →",
    resultsBtn: "ΑΠΟΤΕΛΕΣΜΑΤΑ →",
    scoreLabel: "Βαθμολογία Κουλτούρας",
    restart: "ΠΑΙΞΕ ΞΑΝΑ",
    print: "ΕΞΑΓΩΓΗ PDF",
    verdicts: { great: "ΙΔΑΝΙΚΗ ΕΦΑΡΜΟΓΗ", good: "ΔΥΝΑΤΟ FIT", partial: "ΚΑΛΕΣ ΒΑΣΕΙΣ", low: "ΠΕΡΙΘΩΡΙΟ ΒΕΛΤΙΩΣΗΣ" },
    resultTexts: {
      great: "Εξαιρετική ευθυγράμμιση με την κουλτούρα της Cosmos Sport. Ενσαρκώνεις τις αξίες: πάθος, απόδοση, ομαδικότητα και εστίαση στον πελάτη. Θα ανθίσεις από την πρώτη μέρα.",
      good: "Δυνατή ευθυγράμμιση με την κουλτούρα. Οι αντιδράσεις σου είναι σωστές στις περισσότερες καταστάσεις. Με λίγη καθοδήγηση θα γίνεις πολύτιμο μέλος.",
      partial: "Έχεις σωστές βάσεις αλλά υπάρχουν σημεία για βελτίωση. Αναλογίσου τα σενάρια όπου δίστασες, είναι ευκαιρίες ανάπτυξης.",
      low: "Ο υποψήφιος/α ίσως χρειάζεται αλλαγή νοοτροπίας. Η Cosmos Sport βασίζεται στην ομαδικότητα, την ενέργεια και τον πελάτη. Σκέψου πόσο ταιριάζουν σε σένα."
    },
    dimLabels: { customer: "Πελατοκεντρισμός", team: "Ομαδικότητα", performance: "Απόδοση", passion: "Πάθος για Brand" },
    candidatePrefix: "Υποψήφιος/α: "
  }
};

let currentLang = 'en';
let currentQ = 0, totalScore = 0, answered = false;
let dimScores = { customer: 0, team: 0, performance: 0, passion: 0 };
let dimensionMaxPossible = { customer: 0, team: 0, performance: 0, passion: 0 };
let candidateName = "";

function computeDimensionMaxima() {
  const newMax = { customer: 0, team: 0, performance: 0, passion: 0 };
  for (let q of questions) {
    const opts = (currentLang === 'en') ? q.optionsEn : q.optionsEl;
    let maxScorePerQ = -Infinity;
    let dimOfQ = null;
    for (let opt of opts) {
      if (opt.score > maxScorePerQ) {
        maxScorePerQ = opt.score;
        dimOfQ = opt.dim;
      }
    }
    if (dimOfQ && maxScorePerQ > 0) {
      newMax[dimOfQ] += maxScorePerQ;
    }
  }
  return newMax;
}

function refreshDimensionMax() {
  dimensionMaxPossible = computeDimensionMaxima();
}

// Οι ερωτήσεις (ίδιες με πριν)
const questions = [
  {
    id: 1,
    categoryEn: "Strategy",
    categoryEl: "Στρατηγική",
    textEn: "How would you explain the omnichannel approach of Cosmos Sport to a new team member?",
    textEl: "Πώς θα εξηγούσες την omnichannel προσέγγιση της Cosmos Sport σε έναν νέο συνάδελφο;",
    contextEn: "They ask why we have both physical stores and an e shop.",
    contextEl: "Σε ρωτάει γιατί έχουμε και φυσικά καταστήματα και e shop.",
    optionsEn: [
      { text: "We keep stores and e shop separate but make sure both work well.", score: 1, dim: "customer" },

function updateUITexts() {
  const s = strings[currentLang];
  document.getElementById('headerLabel').innerHTML = s.headerLabel;
  if (!document.getElementById('screen-result').classList.contains('active')) 
    document.getElementById('header-title').innerHTML = s.headerTitleDefault;
  document.getElementById('introBadge').innerHTML = s.introBadge;
  document.getElementById('introHeading').innerHTML = s.introHeading;
  document.getElementById('introSub').innerHTML = s.introSub;
  document.getElementById('nameLabel').innerHTML = s.nameLabel;
  document.getElementById('candidateName').placeholder = s.namePlaceholder;
  
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(key==='perf') el.innerText = s.pillars.perf;
    if(key==='team') el.innerText = s.pillars.team;
    if(key==='pass') el.innerText = s.pillars.pass;
    if(key==='cust') el.innerText = s.pillars.cust;
  });
  document.getElementById('startBtn').innerHTML = s.startBtn;
  const nextBtn = document.getElementById('next-btn');
  if(nextBtn) nextBtn.innerHTML = (currentQ === questions.length-1 ? (currentLang === 'en' ? "SEE RESULTS →" : "ΑΠΟΤΕΛΕΣΜΑΤΑ →") : s.nextBtn);
  document.getElementById('scoreLabel').innerHTML = s.scoreLabel;
  document.getElementById('restartBtn').innerHTML = s.restart;
  document.getElementById('printBtn').innerHTML = s.print;
  refreshDimensionMax();
  if (document.getElementById('screen-question').classList.contains('active') && questions[currentQ]) loadQuestion();
  if (document.getElementById('screen-result').classList.contains('active')) showResults();
  
  // Update name display text
  if (candidateName) {
    document.getElementById('nameDisplayText').innerText = candidateName;
    document.getElementById('resultNameDisplay').innerHTML = `${s.candidatePrefix}${candidateName}`;
  }
}

function loadQuestion() {
  refreshDimensionMax();
  const q = questions[currentQ];
  const isEn = currentLang === 'en';
  document.getElementById('q-category').innerHTML = isEn ? q.categoryEn : q.categoryEl;
  document.getElementById('q-counter').innerHTML = `${currentQ+1} / ${questions.length}`;
  document.getElementById('q-text').innerHTML = isEn ? q.textEn : q.textEl;
  const ctxDiv = document.getElementById('q-context');
  const ctxText = isEn ? q.contextEn : q.contextEl;
  ctxDiv.innerText = ctxText || '';
  ctxDiv.style.display = ctxText ? 'block' : 'none';
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const optsArr = isEn ? q.optionsEn : q.optionsEl;
  ['A','B','C','D'].forEach((l,idx) => {
    if(!optsArr[idx]) return;
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-letter">${l}</span><span>${optsArr[idx].text}</span>`;
    btn.onclick = () => selectOption(idx, optsArr[idx]);
    optsDiv.appendChild(btn);
  });
  document.getElementById('feedback-box').className = 'feedback-box';
  document.getElementById('feedback-box').innerHTML = '';
  document.getElementById('next-btn').classList.remove('show');
  answered = false;
  document.getElementById('progress-bar').style.width = ((currentQ/questions.length)*100)+'%';
}

function selectOption(idx, chosen) {
  if(answered) return;
  answered = true;
  const q = questions[currentQ];
  const isEn = currentLang === 'en';
  const allOpts = isEn ? q.optionsEn : q.optionsEl;
  const maxScore = Math.max(...allOpts.map(o=>o.score));
  totalScore += chosen.score;
  dimScores[chosen.dim] = (dimScores[chosen.dim]||0)+chosen.score;
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn,i) => {
    btn.disabled = true;
    if(i===idx) btn.classList.add(chosen.score===maxScore?'correct':'wrong');
    else if(allOpts[i] && allOpts[i].score===maxScore) btn.classList.add('reveal');
  });
  const fbDiv = document.getElementById('feedback-box');
  const isGood = chosen.score === maxScore;
  let feedbackText = '';
  if (isGood) feedbackText = isEn ? q.feedbackBestEn : q.feedbackBestEl;
  else feedbackText = isEn ? (q.feedbackOtherEn || "Consider reflecting on this.") : (q.feedbackOtherEl || "Σκέψου το ξανά.");
  fbDiv.innerHTML = (isGood ? '✓ ' : '') + feedbackText;
  fbDiv.className = `feedback-box show ${isGood ? 'good' : 'bad'}`;
  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion() { currentQ++; if(currentQ >= questions.length) showResults(); else loadQuestion(); }

function showResults() {
  document.getElementById('screen-question').classList.remove('active');
  document.getElementById('screen-result').classList.add('active');
  refreshDimensionMax();
  const maxPossible = questions.reduce((s,q)=>s+Math.max(...(currentLang==='en'?q.optionsEn:q.optionsEl).map(o=>o.score)),0);
  document.getElementById('score-display').innerHTML = `${totalScore}<span>/${maxPossible}</span>`;
  const pct = maxPossible ? Math.round((totalScore/maxPossible)*100) : 0;
  let verdictKey = pct>=85?'great':(pct>=65?'good':(pct>=45?'partial':'low'));
  const vText = strings[currentLang].verdicts[verdictKey];
  const resultMsg = strings[currentLang].resultTexts[verdictKey];
  const vClass = {great:'great',good:'good-fit',partial:'partial',low:'low'}[verdictKey];
  document.getElementById('verdict-badge-wrap').innerHTML = `<span class="verdict-badge ${vClass}">${vText}</span>`;
  document.getElementById('result-text').innerHTML = resultMsg;
  
  // Update candidate name in results
  if (candidateName) {
    document.getElementById('resultNameDisplay').innerHTML = `${strings[currentLang].candidatePrefix}${candidateName}`;
  }
  
  const dimGrid = document.getElementById('dimension-grid');
  dimGrid.innerHTML = '';
  const dimLabels = strings[currentLang].dimLabels;
  for (let dim of ['customer','team','performance','passion']) {
    const maxVal = dimensionMaxPossible[dim] || 1;
    const scoreVal = dimScores[dim] || 0;
    const dp = Math.min(100, Math.round((scoreVal / maxVal) * 100));
    const card = document.createElement('div'); card.className='dimension-card';
    card.innerHTML = `<div class="dim-name">${dimLabels[dim]}</div><div class="dim-bar-outer"><div class="dim-bar-inner" data-pct="${dp}"></div></div><div class="dim-score">${dp}%</div>`;
    dimGrid.appendChild(card);
  }
  setTimeout(()=>{ document.querySelectorAll('.dim-bar-inner').forEach(b=>b.style.width=b.dataset.pct+'%'); }, 50);
}

function restartGame(){ 
  currentQ=0; 
  totalScore=0; 
  answered=false; 
  dimScores={customer:0,team:0,performance:0,passion:0}; 
  document.getElementById('screen-result').classList.remove('active'); 
  document.getElementById('screen-intro').classList.add('active'); 
  document.getElementById('progress-bar').style.width='0%'; 
  document.getElementById('header-title').innerHTML=strings[currentLang].headerTitleDefault; 
  refreshDimensionMax(); 
  
  // Clear name display in results
  document.getElementById('resultNameDisplay').innerHTML = '';
}

// Enhanced PDF export function with candidate name
function exportToPDF() {
  // Εμφανίζουμε προσωρινά ένα μήνυμα
  const printBtn = document.getElementById('printBtn');
  const originalText = printBtn.innerHTML;
  printBtn.innerHTML = '📄 OPEN PRINT DIALOG...';
  
  setTimeout(() => {
    window.print();
    printBtn.innerHTML = originalText;
  }, 100);
}

// Track candidate name input
document.getElementById('candidateName').addEventListener('input', function(e) {
  candidateName = e.target.value;
  if (candidateName && candidateName.trim() !== "") {
    document.getElementById('nameDisplay').style.display = 'block';
    document.getElementById('nameDisplayText').innerHTML = candidateName;
  } else {
    document.getElementById('nameDisplay').style.display = 'none';
  }
});

document.getElementById('startBtn').onclick = ()=>{ 
  // Get name before starting
  const nameInput = document.getElementById('candidateName');
  if (nameInput.value && nameInput.value.trim() !== "") {
    candidateName = nameInput.value.trim();
    document.getElementById('nameDisplayText').innerHTML = candidateName;
    document.getElementById('nameDisplay').style.display = 'block';
  }
  document.getElementById('screen-intro').classList.remove('active'); 
  document.getElementById('screen-question').classList.add('active'); 
  loadQuestion(); 
};

document.getElementById('next-btn').onclick = nextQuestion;
document.getElementById('restartBtn').onclick = restartGame;
document.getElementById('printBtn').onclick = exportToPDF;

document.querySelectorAll('.lang-btn').forEach(btn=>{ 
  btn.onclick = ()=>{ 
    currentLang = btn.getAttribute('data-lang'); 
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active')); 
    btn.classList.add('active'); 
    updateUITexts(); 
    if(document.getElementById('screen-question').classList.contains('active')) loadQuestion(); 
    if(document.getElementById('screen-result').classList.contains('active')) showResults(); 
    if(document.getElementById('screen-intro').classList.contains('active')) updateUITexts(); 
  }; 
});

refreshDimensionMax();
updateUITexts();
</script>
</body>
</html>
